<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Automation Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1e293b;
      color: #f8fafc;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    header .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header .subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 0.1rem;
    }

    main {
      flex: 1;
      max-width: 800px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .hero {
      margin-bottom: 2.5rem;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: #64748b;
      font-size: 1rem;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .tool-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .tool-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
      border-color: #cbd5e1;
    }

    .tool-card .icon {
      width: 40px;
      height: 40px;
      background: #eff6ff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .tool-card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0f172a;
    }

    .tool-card p {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
      flex: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.6rem 1.1rem;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      align-self: flex-start;
      transition: background 0.15s;
    }

    .btn:hover { background: #1d4ed8; }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* ─── Theme toggle button ────────────────────────────────────────────────── */
    #theme-btn {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: #94a3b8;
      padding: 0.25rem;
      line-height: 1;
      transition: color 0.15s;
    }
    #theme-btn:hover { color: #f8fafc; }

    /* ─── Dark mode overrides ────────────────────────────────────────────────── */
    :root.dark { color-scheme: dark; }
    .dark body { background: #0f172a; color: #e2e8f0; }
    .dark header { background: #0f172a; }
    .dark .hero h1 { color: #f1f5f9; }
    .dark .hero p { color: #94a3b8; }
    .dark .tool-card {
      background: #1e293b; border-color: #334155; box-shadow: none;
    }
    .dark .tool-card:hover { border-color: #475569; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    .dark .tool-card .icon { background: #1e3a5f; }
    .dark .tool-card h2 { color: #f1f5f9; }
    .dark .tool-card p { color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="logo">QA Automation Hub</div>
      <div class="subtitle">Automated quality assurance tools</div>
    </div>
    <button id="theme-btn" title="Toggle dark mode">🌙</button>
  </header>
  <script>
    (function () {
      const html = document.documentElement;
      const btn = document.getElementById('theme-btn');
      function applyScheme(dark) {
        html.classList.toggle('dark', dark);
        btn.textContent = dark ? '☀' : '🌙';
      }
      applyScheme(localStorage.getItem('colorScheme') === 'dark');
      btn.addEventListener('click', () => {
        const isDark = html.classList.toggle('dark');
        localStorage.setItem('colorScheme', isDark ? 'dark' : 'light');
        btn.textContent = isDark ? '☀' : '🌙';
      });
    })();
  </script>

  <main>
    <div class="hero">
      <h1>Welcome</h1>
      <p>Use the tools below to automate your QA workflow.</p>
    </div>

    <div class="tools-grid">
      <div class="tool-card">
        <div class="icon">&#9881;</div>
        <h2>Test Case Generator</h2>
        <p>Generate structured test cases from user story IDs. Supports batch processing of multiple stories at once.</p>
        <a href="/generate" class="btn">Open Generator &#8594;</a>
      </div>
    </div>
  </main>

  <footer>QA Automation Hub</footer>
</body>
</html>
