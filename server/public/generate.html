<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Case Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ─────────────────────────────────────────────────────────────── */
    header {
      background: #1e293b;
      color: #f8fafc;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: #f8fafc; }

    .header-sep { color: #475569; }

    header h1 { font-size: 1rem; font-weight: 600; }

    /* ─── Layout ─────────────────────────────────────────────────────────────── */
    main {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      width: 100%;
    }

    /* ─── Form card ──────────────────────────────────────────────────────────── */
    .form-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }

    .form-card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 1rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .input-wrap { flex: 1; }

    .input-wrap label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 0.35rem;
    }

    .input-wrap input {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 0.9rem;
      color: #1e293b;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-wrap input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    .input-wrap input.invalid {
      border-color: #ef4444;
    }

    .story-links {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      min-height: 1.5rem;
    }

    .story-links a {
      font-size: 0.78rem;
      color: #2563eb;
      text-decoration: none;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 5px;
      padding: 0.15rem 0.5rem;
      transition: background 0.15s;
    }
    .story-links a:hover { background: #dbeafe; }

    .btn-generate {
      margin-top: 1.45rem;
      padding: 0.6rem 1.25rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-generate:hover:not(:disabled) { background: #1d4ed8; }
    .btn-generate:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ─── Runs section ───────────────────────────────────────────────────────── */
    .runs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }

    .runs-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
    }

    .btn-cancel-all {
      padding: 0.4rem 0.9rem;
      background: transparent;
      border: 1px solid #fca5a5;
      color: #ef4444;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-cancel-all:hover { background: #fef2f2; }

    .runs-list { display: flex; flex-direction: column; gap: 1.25rem; }

    /* ─── Batch card ─────────────────────────────────────────────────────────── */
    .batch-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }

    .batch-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1.25rem;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .batch-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #1e293b;
      flex: 1;
    }

    .timer {
      font-size: 0.78rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: #64748b;
    }

    .btn-cancel {
      padding: 0.3rem 0.7rem;
      background: transparent;
      border: 1px solid #fca5a5;
      color: #ef4444;
      border-radius: 5px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: #fef2f2; }
    .btn-cancel:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ─── Modal links ────────────────────────────────────────────────────────── */
    .modal-story-link {
      color: #2563eb;
      text-decoration: none;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 5px;
      padding: 0.15rem 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .modal-story-link:hover { background: #dbeafe; }

    /* ─── Status badge ───────────────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.22rem 0.6rem;
      border-radius: 20px;
    }
    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge-pending   { background: #f1f5f9; color: #64748b; }
    .badge-running   { background: #eff6ff; color: #2563eb; }
    .badge-completed { background: #f0fdf4; color: #16a34a; }
    .badge-failed    { background: #fef2f2; color: #dc2626; }
    .badge-cancelled { background: #fff7ed; color: #ea580c; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .badge-running::before { animation: pulse 1.2s ease-in-out infinite; }

    /* ─── Batch body ─────────────────────────────────────────────────────────── */
    .batch-body { padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 1rem; }

    /* ─── Auth block ─────────────────────────────────────────────────────────── */
    .auth-block {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }

    .block-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.9rem;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer;
      user-select: none;
    }
    .block-header:hover { background: #f1f5f9; }

    .block-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      flex: 1;
    }

    .toggle-icon {
      font-size: 0.7rem;
      color: #94a3b8;
      transition: transform 0.15s;
    }
    .collapsed .toggle-icon { transform: rotate(-90deg); }

    .log-wrap {
      background: #0f172a;
      max-height: 260px;
      overflow-y: auto;
      padding: 0.75rem 1rem;
    }
    .log-wrap.collapsed { display: none; }

    .log-line {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.75rem;
      line-height: 1.65;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-empty {
      font-size: 0.75rem;
      color: #475569;
      font-style: italic;
    }

    /* ─── Jobs list ──────────────────────────────────────────────────────────── */
    .jobs-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .job-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }

    .job-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.9rem;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .job-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #1e293b;
      flex: 1;
    }

    .job-timer {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-link">&#8592; Home</a>
    <span class="header-sep">/</span>
    <h1>Test Case Generator</h1>
  </header>

  <main>
    <!-- Input form -->
    <div class="form-card">
      <h2>Generate Test Cases</h2>
      <div class="input-row">
        <div class="input-wrap">
          <label for="story-ids-input">Story IDs (comma-separated, each must be 3+ digits)</label>
          <input
            id="story-ids-input"
            type="text"
            placeholder="e.g. 112, 113, 114"
            autocomplete="off"
          />
          <div class="story-links" id="story-links"></div>
        </div>
        <button class="btn-generate" id="generate-btn" disabled>Generate Test Cases</button>
      </div>
    </div>

    <!-- Runs section -->
    <div id="runs-section" style="display:none">
      <div class="runs-header">
        <h2>Runs</h2>
        <button class="btn-cancel-all" id="cancel-all-btn">Cancel All</button>
      </div>
      <div class="runs-list" id="runs-list"></div>
    </div>
  </main>

  <!-- Confirm modal -->
  <div id="modal-backdrop" style="
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.45); z-index:100;
    align-items:center; justify-content:center;
  ">
    <div style="
      background:#fff; border-radius:12px; padding:1.75rem;
      width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.25);
    ">
      <h2 style="font-size:1rem; font-weight:700; margin-bottom:0.5rem;">Confirm Generation</h2>
      <p style="font-size:0.875rem; color:#64748b; margin-bottom:1rem;">
        Generate test cases for the following story IDs?
      </p>
      <div id="modal-ids" style="
        background:#f8fafc; border:1px solid #e2e8f0;
        border-radius:7px; padding:0.6rem 0.9rem;
        font-size:0.875rem; font-weight:500; color:#1e293b;
        margin-bottom:1.5rem;
      "></div>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
        <button id="modal-cancel" style="
          padding:0.55rem 1rem; border:1px solid #e2e8f0;
          background:#fff; border-radius:7px; font-size:0.875rem;
          cursor:pointer; color:#475569;
        ">Cancel</button>
        <button id="modal-confirm" style="
          padding:0.55rem 1.1rem; background:#2563eb;
          color:#fff; border:none; border-radius:7px;
          font-size:0.875rem; font-weight:500; cursor:pointer;
        ">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Cancel confirm modal -->
  <div id="cancel-modal-backdrop" style="
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.45); z-index:100;
    align-items:center; justify-content:center;
  ">
    <div style="
      background:#fff; border-radius:12px; padding:1.75rem;
      width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.25);
    ">
      <h2 style="font-size:1rem; font-weight:700; margin-bottom:0.5rem;">Confirm Cancel</h2>
      <p id="cancel-modal-msg" style="font-size:0.875rem; color:#64748b; margin-bottom:1.5rem;"></p>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
        <button id="cancel-modal-dismiss" style="
          padding:0.55rem 1rem; border:1px solid #e2e8f0;
          background:#fff; border-radius:7px; font-size:0.875rem;
          cursor:pointer; color:#475569;
        ">Keep Running</button>
        <button id="cancel-modal-confirm" style="
          padding:0.55rem 1.1rem; background:#ef4444;
          color:#fff; border:none; border-radius:7px;
          font-size:0.875rem; font-weight:500; cursor:pointer;
        ">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // ─── State ─────────────────────────────────────────────────────────────────
    let trackerBaseUrl = '';
    const batchStartTimes = new Map(); // batchId -> number
    const jobStartTimes = new Map();   // `${batchId}:${storyId}` -> number

    // ─── Config ────────────────────────────────────────────────────────────────
    async function loadConfig() {
      try {
        const r = await fetch('/api/config');
        const c = await r.json();
        trackerBaseUrl = c.trackerUrl ?? '';
      } catch { /* ignore */ }
    }

    // ─── Input / links ─────────────────────────────────────────────────────────
    function parseIds(val) {
      return val.split(',').map(s => s.trim()).filter(s => /^\d{3,}$/.test(s));
    }

    const storyInput = document.getElementById('story-ids-input');
    const generateBtn = document.getElementById('generate-btn');
    const storyLinksEl = document.getElementById('story-links');

    storyInput.addEventListener('input', () => {
      const ids = parseIds(storyInput.value);
      generateBtn.disabled = ids.length === 0;

      storyLinksEl.innerHTML = '';
      for (const id of ids) {
        const a = document.createElement('a');
        a.href = `${trackerBaseUrl}/tasks/${id}`;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = `#${id} ↗`;
        storyLinksEl.appendChild(a);
      }
    });

    // ─── Modal ─────────────────────────────────────────────────────────────────
    const backdrop = document.getElementById('modal-backdrop');
    const modalIds = document.getElementById('modal-ids');
    const modalConfirm = document.getElementById('modal-confirm');
    const modalCancel = document.getElementById('modal-cancel');

    function showModal(ids, onConfirm) {
      modalIds.innerHTML = ids.map(id => {
        if (trackerBaseUrl) {
          return `<a class="modal-story-link" href="${escHtml(trackerBaseUrl)}/tasks/${id}" target="_blank" rel="noopener noreferrer">#${id} ↗</a>`;
        }
        return `<span style="font-weight:500;">#${id}</span>`;
      }).join(' ');
      backdrop.style.display = 'flex';
      modalConfirm.onclick = () => { backdrop.style.display = 'none'; onConfirm(); };
      modalCancel.onclick = () => { backdrop.style.display = 'none'; };
    }

    backdrop.addEventListener('click', e => {
      if (e.target === backdrop) backdrop.style.display = 'none';
    });

    // ─── Cancel confirm modal ──────────────────────────────────────────────────
    const cancelBackdrop = document.getElementById('cancel-modal-backdrop');
    const cancelModalMsg = document.getElementById('cancel-modal-msg');
    const cancelModalConfirmBtn = document.getElementById('cancel-modal-confirm');
    const cancelModalDismiss = document.getElementById('cancel-modal-dismiss');

    function showCancelConfirm(message, onConfirm) {
      cancelModalMsg.textContent = message;
      cancelBackdrop.style.display = 'flex';
      cancelModalConfirmBtn.onclick = () => { cancelBackdrop.style.display = 'none'; onConfirm(); };
      cancelModalDismiss.onclick = () => { cancelBackdrop.style.display = 'none'; };
    }

    cancelBackdrop.addEventListener('click', e => {
      if (e.target === cancelBackdrop) cancelBackdrop.style.display = 'none';
    });

    function hideAllCancelButtons(batchId) {
      document.querySelectorAll(`.batch-cancel-btn[data-batch-id="${batchId}"]`)
        .forEach(btn => btn.style.display = 'none');
      document.querySelectorAll(`.job-cancel-btn[data-batch-id="${batchId}"]`)
        .forEach(btn => btn.style.display = 'none');
    }

    function confirmAndCancelBatch(batchId) {
      showCancelConfirm('Cancel this entire run?', () => {
        cancelBatch(batchId);
        hideAllCancelButtons(batchId);
      });
    }

    function confirmAndCancelJob(batchId, storyId) {
      showCancelConfirm(`Cancel job for Story #${storyId}?`, () => {
        cancelJob(batchId, storyId);
        document.querySelectorAll(`.job-cancel-btn[data-batch-id="${batchId}"][data-story-id="${storyId}"]`)
          .forEach(btn => btn.style.display = 'none');
      });
    }

    function confirmAndCancelAll() {
      showCancelConfirm('Cancel all running jobs?', () => {
        cancelAll();
        document.querySelectorAll('.btn-cancel').forEach(btn => btn.style.display = 'none');
        document.getElementById('cancel-all-btn').style.display = 'none';
      });
    }

    generateBtn.addEventListener('click', () => {
      const ids = parseIds(storyInput.value);
      if (ids.length === 0) return;
      showModal(ids, () => submitGenerate(ids));
    });

    // ─── API ───────────────────────────────────────────────────────────────────
    async function submitGenerate(storyIds) {
      const r = await fetch('/api/batches', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ storyIds }),
      });
      const { id, batch } = await r.json();
      batchStartTimes.set(id, batch.startedAt);
      renderBatch(batch);
      subscribeSSE(id);
    }

    async function cancelBatch(batchId) {
      await fetch(`/api/batches/${batchId}`, { method: 'DELETE' });
    }

    async function cancelJob(batchId, storyId) {
      await fetch(`/api/batches/${batchId}/jobs/${storyId}`, { method: 'DELETE' });
    }

    async function cancelAll() {
      await fetch('/api/batches', { method: 'DELETE' });
    }

    document.getElementById('cancel-all-btn').addEventListener('click', confirmAndCancelAll);

    // ─── SSE ───────────────────────────────────────────────────────────────────
    function subscribeSSE(batchId) {
      const es = new EventSource(`/api/batches/${batchId}/stream`);

      es.addEventListener('log', e => {
        const { block, storyId, text } = JSON.parse(e.data);
        if (block === 'auth') {
          appendAuthLog(batchId, text);
        } else {
          appendPipelineLog(batchId, storyId, text);
        }
      });

      es.addEventListener('auth-status', e => {
        const { status } = JSON.parse(e.data);
        setAuthStatus(batchId, status);
      });

      es.addEventListener('job-status', e => {
        const { storyId, status, startedAt } = JSON.parse(e.data);
        if (startedAt) jobStartTimes.set(`${batchId}:${storyId}`, startedAt);
        setJobStatus(batchId, storyId, status);
      });

      es.addEventListener('batch-done', e => {
        const { status } = JSON.parse(e.data);
        setBatchStatus(batchId, status);
        batchStartTimes.delete(batchId);
        es.close();
      });

      es.addEventListener('error', () => es.close());
    }

    // ─── Render batch ──────────────────────────────────────────────────────────
    function renderBatch(batch) {
      document.getElementById('runs-section').style.display = '';

      const card = document.createElement('div');
      card.className = 'batch-card';
      card.dataset.batchId = batch.id;

      const ids = batch.storyIds.map(id => `#${id}`).join(', ');
      const ts = new Date(batch.startedAt).toLocaleTimeString();

      card.innerHTML = `
        <div class="batch-header">
          <span class="batch-title">${escHtml(ids)} &nbsp;<span style="font-weight:400;color:#94a3b8;font-size:0.78rem">${ts}</span></span>
          <span class="timer batch-timer" data-batch-id="${batch.id}"></span>
          <span class="badge badge-${batch.status} batch-badge" data-batch-id="${batch.id}">${batch.status}</span>
          <button class="btn-cancel batch-cancel-btn" data-batch-id="${batch.id}"
            style="${batch.status !== 'running' ? 'display:none' : ''}"
            onclick="confirmAndCancelBatch('${batch.id}')">Cancel</button>
        </div>
        <div class="batch-body">
          <div class="auth-block" data-batch-id="${batch.id}">
            <div class="block-header" onclick="toggleBlock(this)">
              <span class="block-label">Auth</span>
              <span class="badge badge-${batch.authStatus} auth-badge" data-batch-id="${batch.id}">${batch.authStatus}</span>
              <span class="toggle-icon">&#9660;</span>
            </div>
            <div class="log-wrap auth-log" data-batch-id="${batch.id}">
              ${batch.authLogs.length === 0
                ? '<div class="log-empty">Waiting for auth...</div>'
                : batch.authLogs.map(l => `<div class="log-line">${escHtml(l)}</div>`).join('')}
            </div>
          </div>
          <div class="jobs-list" data-batch-id="${batch.id}">
            ${Object.values(batch.jobs).map(job => renderJobCard(batch.id, job)).join('')}
          </div>
        </div>
      `;

      const list = document.getElementById('runs-list');
      list.prepend(card);

      if (batch.startedAt && batch.status === 'running') {
        batchStartTimes.set(batch.id, batch.startedAt);
      }
    }

    function renderJobCard(batchId, job) {
      return `
        <div class="job-card" data-batch-id="${batchId}" data-story-id="${job.storyId}">
          <div class="job-header">
            <span class="job-title">Story #${escHtml(job.storyId)}</span>
            <span class="job-timer" data-batch-id="${batchId}" data-story-id="${job.storyId}"></span>
            <span class="badge badge-${job.status} job-badge"
                  data-batch-id="${batchId}" data-story-id="${job.storyId}">${job.status}</span>
            <button class="btn-cancel job-cancel-btn"
                    data-batch-id="${batchId}" data-story-id="${job.storyId}"
                    style="${job.status !== 'running' && job.status !== 'pending' ? 'display:none' : ''}"
                    onclick="confirmAndCancelJob('${batchId}','${job.storyId}')">Cancel</button>
          </div>
          <div class="block-header" onclick="toggleBlock(this)">
            <span class="block-label">Pipeline</span>
            <span class="toggle-icon">&#9660;</span>
          </div>
          <div class="log-wrap pipeline-log" data-batch-id="${batchId}" data-story-id="${job.storyId}">
            ${job.pipelineLogs.length === 0
              ? `<div class="log-empty">Waiting for pipeline...</div>`
              : job.pipelineLogs.map(l => `<div class="log-line">${escHtml(l)}</div>`).join('')}
          </div>
        </div>
      `;
    }

    // ─── DOM updates ───────────────────────────────────────────────────────────
    function appendAuthLog(batchId, text) {
      const wrap = document.querySelector(`.auth-log[data-batch-id="${batchId}"]`);
      if (!wrap) return;
      const empty = wrap.querySelector('.log-empty');
      if (empty) empty.remove();
      const div = document.createElement('div');
      div.className = 'log-line';
      div.textContent = text;
      wrap.appendChild(div);
      scrollIfBottom(wrap);
    }

    function appendPipelineLog(batchId, storyId, text) {
      const wrap = document.querySelector(`.pipeline-log[data-batch-id="${batchId}"][data-story-id="${storyId}"]`);
      if (!wrap) return;
      const empty = wrap.querySelector('.log-empty');
      if (empty) empty.remove();
      const div = document.createElement('div');
      div.className = 'log-line';
      div.textContent = text;
      wrap.appendChild(div);
      scrollIfBottom(wrap);
    }

    function scrollIfBottom(el) {
      const threshold = 60;
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < threshold;
      if (atBottom) el.scrollTop = el.scrollHeight;
    }

    function setAuthStatus(batchId, status) {
      const badge = document.querySelector(`.auth-badge[data-batch-id="${batchId}"]`);
      if (badge) {
        badge.className = `badge badge-${status} auth-badge`;
        badge.setAttribute('data-batch-id', batchId);
        badge.textContent = status;
      }
    }

    function setJobStatus(batchId, storyId, status) {
      const badge = document.querySelector(`.job-badge[data-batch-id="${batchId}"][data-story-id="${storyId}"]`);
      if (badge) {
        badge.className = `badge badge-${status} job-badge`;
        badge.setAttribute('data-batch-id', batchId);
        badge.setAttribute('data-story-id', storyId);
        badge.textContent = status;
      }
      const cancelBtn = document.querySelector(`.job-cancel-btn[data-batch-id="${batchId}"][data-story-id="${storyId}"]`);
      if (cancelBtn) {
        if (status === 'running' || status === 'pending') {
          cancelBtn.style.display = '';
          cancelBtn.disabled = false;
        } else {
          cancelBtn.style.display = 'none';
        }
      }
      if (status !== 'running') {
        jobStartTimes.delete(`${batchId}:${storyId}`);
        const timerEl = document.querySelector(`.job-timer[data-batch-id="${batchId}"][data-story-id="${storyId}"]`);
        if (timerEl) timerEl.textContent = '';
      }
    }

    function setBatchStatus(batchId, status) {
      const badge = document.querySelector(`.batch-badge[data-batch-id="${batchId}"]`);
      if (badge) {
        badge.className = `badge badge-${status} batch-badge`;
        badge.setAttribute('data-batch-id', batchId);
        badge.textContent = status;
      }
      hideAllCancelButtons(batchId);

      batchStartTimes.delete(batchId);
      const timerEl = document.querySelector(`.batch-timer[data-batch-id="${batchId}"]`);
      if (timerEl) timerEl.textContent = '';
    }

    // ─── Timers ────────────────────────────────────────────────────────────────
    function fmtElapsed(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      if (h > 0) return `${h}:${pad(m % 60)}:${pad(s % 60)}`;
      return `${m}:${pad(s % 60)}`;
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    setInterval(() => {
      const now = Date.now();

      for (const [batchId, startedAt] of batchStartTimes) {
        const el = document.querySelector(`.batch-timer[data-batch-id="${batchId}"]`);
        if (el) el.textContent = fmtElapsed(now - startedAt);
      }

      for (const [key, startedAt] of jobStartTimes) {
        const [batchId, storyId] = key.split(':');
        const el = document.querySelector(`.job-timer[data-batch-id="${batchId}"][data-story-id="${storyId}"]`);
        if (el) el.textContent = fmtElapsed(now - startedAt);
      }
    }, 1000);

    // ─── Collapsible blocks ────────────────────────────────────────────────────
    function toggleBlock(headerEl) {
      const logWrap = headerEl.nextElementSibling;
      if (!logWrap) return;
      const isCollapsed = logWrap.classList.toggle('collapsed');
      headerEl.classList.toggle('collapsed', isCollapsed);
    }

    // ─── Load existing batches on page load ────────────────────────────────────
    async function loadBatches() {
      try {
        const r = await fetch('/api/batches');
        const list = await r.json();
        // iterate oldest-first so prepend gives newest-at-top
        for (const batch of list) {
          if (batch.status === 'running') {
            // render with empty logs — SSE replay will fill them in (avoids duplication)
            const empty = {
              ...batch,
              authLogs: [],
              jobs: Object.fromEntries(
                Object.entries(batch.jobs).map(([k, v]) => [k, { ...v, pipelineLogs: [] }])
              ),
            };
            renderBatch(empty);
            subscribeSSE(batch.id);
          } else {
            renderBatch(batch);
          }
        }
        if (list.length > 0) {
          document.getElementById('runs-section').style.display = '';
        }
      } catch { /* ignore */ }
    }

    // ─── Escape HTML ───────────────────────────────────────────────────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ─── Init ──────────────────────────────────────────────────────────────────
    loadConfig().then(loadBatches);
  </script>
</body>
</html>
