services:
  app:
    image: us-tc-generator:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - playwright-auth:/app/.playwright-auth
      - workflow-artifacts:/app/.workflow-artifacts
    expose:
      - "4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  playwright-auth:
  workflow-artifacts:
